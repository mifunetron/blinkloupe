[package]
name = "blinkloupe"
version = "0.10.0"
description = "BlinkLoupe: live view and comparison for AI image generation"
license = "Apache-2.0"
repository = "https://github.com/mifunetron/blinkloupe"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
rfd = "0.15"
native-tls = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
